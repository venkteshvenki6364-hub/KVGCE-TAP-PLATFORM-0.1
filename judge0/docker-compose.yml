version: '3.8'

services:
  judge0-server:
    image: judge0/judge0:latest
    container_name: judge0-server
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    restart: always
    environment:
      - JUDGE0_HOMEPAGE_MESSAGE=KVGCE-TAP Platform Judge0 CE Execution Server
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-worker:
    image: judge0/judge0:latest
    container_name: judge0-worker
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: always
    depends_on:
      - judge0-server
      - judge0-db
      - judge0-redis

  judge0-db:
    image: postgres:13.0
    container_name: judge0-db
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0secretpassword
      POSTGRES_DB: judge0
    volumes:
      - judge0-db-data:/var/lib/postgresql/data
    restart: always

  judge0-redis:
    image: redis:6.0
    container_name: judge0-redis
    command: redis-server --requirepass judge0secretpassword
    restart: always

volumes:
  judge0-db-data:
