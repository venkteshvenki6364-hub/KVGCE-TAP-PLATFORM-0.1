################################################################################
# Judge0 CE Configuration
################################################################################

# Server settings
PORT=2358
RAILS_MAX_THREADS=5
LOG_LEVEL=info

# Security & Sandboxing
MAINTENANCE_MODE=false
ALLOW_UNAUTHENTICATED_EXECUTION=true

# Execution Time & Limits
CPU_TIME_LIMIT=5.0
MAX_CPU_TIME_LIMIT=15.0
CPU_EXTRA_TIME=1.0
MAX_CPU_EXTRA_TIME=5.0
WALL_TIME_LIMIT=10.0
MAX_WALL_TIME_LIMIT=20.0
MEMORY_LIMIT=128000
MAX_MEMORY_LIMIT=512000
STACK_LIMIT=64000
MAX_STACK_LIMIT=128000
MAX_PROCESSES_AND_OR_THREADS=60
MAX_OUTPUT_SIZE=1024000

# Redis Cache & Queue
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0secretpassword

# Postgres DB
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0secretpassword
